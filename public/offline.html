<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0f172a">
    <title>Sem conexão · ApexPro</title>
    <style>
        :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; }
        body { min-height: 100vh; margin: 0; display: grid; place-items: center; }
        main { max-width: 28rem; padding: 2rem; text-align: center; }
        h1 { color: #22d3ee; font-size: 1.8rem; }
        p { color: #cbd5e1; line-height: 1.6; }
        button { margin-top: 1rem; border: 0; border-radius: .6rem; padding: .8rem 1.2rem; background: #06b6d4; color: #082f49; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>
    <main>
        <h1>Você está sem conexão</h1>
        <p>O ApexPro precisa de internet para carregar seus treinos e avaliações. Confira sua conexão e tente novamente.</p>
        <button type="button" onclick="window.location.reload()">Tentar novamente</button>
    </main>
</body>
</html>
